services:
  gestion-clients:
    build: .
    container_name: gestion-clients
    restart: unless-stopped
    ports:
      - "3000:3000"              # ou "127.0.0.1:3000:3000" derrière un reverse proxy
    environment:
      APP_NAME: ${APP_NAME:-Gestion Clients}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY manquant dans .env — openssl rand -hex 32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env — openssl rand -hex 32}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # mot de passe admin au 1er démarrage (sinon généré, voir les logs)
      ADMIN_REQUIRE_2FA: ${ADMIN_REQUIRE_2FA:-0}   # 1 = 2FA imposée au compte admin dès la 1re connexion
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      IDLE_MINUTES: ${IDLE_MINUTES:-30}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}    # 1 si servie uniquement en HTTPS (active aussi HSTS)
    volumes:
      - ./data:/app/data                    # clients.json, users.json, fichiers, sauvegardes, journal
      - ./branding:/app/branding:ro         # logo optionnel : logo.svg|png (+ logo-dark.* facultatif)
      # Pour la sauvegarde complète chiffrée depuis l'interface admin (inclut l'ENCRYPTION_KEY) :
      - ./.env:/app/host/.env:ro                       # lecture seule
      - ./docker-compose.yml:/app/host/docker-compose.yml:ro
